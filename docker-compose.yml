services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/db.sqlite3}
    volumes:
      - data:/data
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - CONTAINER_ROLE=worker
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/db.sqlite3}
    volumes:
      - data:/data
    depends_on:
      - redis
      - web

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  data:
